{# Auto fill: new actions in the toolbox come with each field set to a workflow input of its
   name, written #name. One toggle button, lit while it is on. #}
<button type="button" class="btn toolbox-tool-toggle toolbox-autofill{{ ' active' if session['autofill'] else '' }}"
        id="autoFillToggle" aria-pressed="{{ 'true' if session['autofill'] else 'false' }}"
        title="Auto fill: each field of a new action takes a #name workflow input" onclick="toggleAutoFill(this)">Auto #</button>
